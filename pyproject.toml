# Tool configuration only; requirements.txt remains unchanged.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py310"
line-length = 100
# Legacy src remains unchanged and outside the initial lint scope.
include = ["tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
